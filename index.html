<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>eGov Careers</title>
<style>
  :root{
    --ink:#12283A;
    --paper:#F1F5F7;
    --card:#FFFFFF;
    --sea:#0E7C86;
    --sea-dark:#0A5C64;
    --sand:#F4A226;
    --muted:#5C7285;
    --line:#DCE5EA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .shell{width:100%;max-width:760px;padding:0 20px 40px;display:flex;flex-direction:column;flex:1;}

  header{padding:28px 0 20px;text-align:center;}
  .logo{display:block;width:min(420px,80%);height:auto;margin:0 auto 6px;}
  h1{font-size:30px;line-height:1.15;margin:14px 0 6px;font-weight:800;letter-spacing:-0.02em;}
  .sub{font-size:16px;color:var(--muted);margin:0;}

  .tabs{display:flex;gap:8px;background:#E5EDF1;padding:6px;border-radius:16px;margin:22px 0 24px;}
  .tab{flex:1;border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;color:var(--muted);
    padding:14px 10px;border-radius:11px;cursor:pointer;transition:background .15s,color .15s;}
  .tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(18,40,58,.10);}

  .view{display:none;flex:1;flex-direction:column;}
  .view.active{display:flex;}

  /* wheel */
  .wheel-stage{display:flex;flex-direction:column;align-items:center;}
  .wheel-wrap{position:relative;width:460px;height:460px;max-width:90vw;max-height:90vw;}
  .pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;
    width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;
    border-top:30px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));}
  #wheel{width:100%;height:100%;transition:transform 4.6s cubic-bezier(0.16,0.68,0.2,1);}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;
    border-radius:50%;background:var(--card);border:5px solid var(--ink);z-index:2;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--sea);font-size:15px;text-align:center;}

  .btn{border:0;font:inherit;font-weight:700;cursor:pointer;border-radius:14px;transition:transform .08s,background .15s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--sea);color:#fff;font-size:19px;padding:16px 40px;box-shadow:0 3px 0 var(--sea-dark);}
  .btn-primary:active{box-shadow:0 1px 0 var(--sea-dark);}
  .spin-btn{margin-top:26px;}
  .reveal-btn{margin-top:14px;border:2px solid var(--sea);background:#fff;color:var(--sea);font:inherit;
    font-weight:700;font-size:16px;padding:11px 22px;border-radius:12px;cursor:pointer;transition:transform .08s;}
  .reveal-btn:active{transform:scale(.97);}

  .result{margin-top:22px;width:100%;min-height:24px;}
  .result-card{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:0 2px 10px rgba(18,40,58,.08);animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .result-kicker{font-size:14px;font-weight:700;color:var(--sea);margin-bottom:8px;}
  .result-body{font-size:20px;line-height:1.5;}
  .result-answer{display:block;margin-top:8px;font-size:16px;color:var(--muted);}
  .emoji-big{font-size:44px;line-height:1;margin-bottom:8px;}

  /* deck */
  .deck-top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);margin-bottom:14px;}
  .deck-card{background:var(--card);border-radius:20px;padding:30px 26px;box-shadow:0 3px 14px rgba(18,40,58,.09);
    min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;}
  .role-pill{align-self:center;font-size:15px;font-weight:700;padding:7px 18px;border-radius:24px;margin-bottom:16px;}
  .day-label{font-size:15px;color:var(--muted);margin-bottom:10px;}
  .statement{font-size:23px;line-height:1.45;font-weight:600;}
  .verdict{margin-top:20px;animation:pop .25s ease;}
  .verdict-box{border-radius:14px;padding:16px 18px;}
  .verdict-label{font-size:22px;font-weight:800;margin-bottom:6px;}
  .verdict-why{font-size:16px;line-height:1.5;}
  .mark{font-size:15px;color:var(--muted);margin-top:12px;}

  .choices{display:flex;gap:12px;margin-top:18px;}
  .choice{flex:1;font-size:18px;padding:18px 10px;border-radius:16px;border:2px solid var(--line);
    background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;transition:transform .08s,border-color .15s;}
  .choice:active{transform:scale(.97);}
  .choice.real{border-color:#9FD8C6;}
  .choice.myth{border-color:#F3C0AA;}
  .next-wrap{margin-top:18px;display:none;}
  .btn-next{width:100%;background:var(--ink);color:#fff;font-size:18px;padding:16px;}

  footer{margin-top:32px;text-align:center;font-size:14px;color:var(--muted);}
  footer b{color:var(--sea);font-weight:700;}

  @media (max-width:480px){
    h1{font-size:25px;}
    .statement{font-size:20px;}
    .result-body{font-size:18px;}
  }
</style>
</head>

    else if(w.type==="egov"){var q2=pick(egovQ);kicker="eGov trivia";body=q2[0];answer=q2[1];}
    else if(w.type==="myth"){kicker="Real or myth?";body="<span style='font-size:22px;font-weight:700;display:block'>Play the game to win!</span><span class='result-answer'>Open the \u201CReal day or myth?\u201D game and get 5 right.</span>";}
    else if(w.type==="job"){kicker="Guess my job?";body="<span style='font-size:22px;font-weight:700;display:block'>Play the game!</span><span class='result-answer'>Try the Guess My Job board and guess the role from the clues.</span>";}
    var html="<div class='result-card'><div class='result-kicker'>"+kicker+"</div><div class='result-body'>"+body+"</div>";
    if(answer){html+="<button class='reveal-btn' id='reveal-btn'>Show answer</button><div class='result-answer' id='answer-line' style='display:none'>Answer: "+answer+"</div>";}
    html+="</div>";
    wr.innerHTML=html;
    var rb=document.getElementById("reveal-btn");
    if(rb){rb.addEventListener("click",function(){document.getElementById("answer-line").style.display="block";rb.style.display="none";});}
  }

  spinBtn.addEventListener("click",function(){
    if(spinning)return;
    spinning=true;wr.innerHTML="";
    var idx=Math.floor(Math.random()*n);
    var c=idx*step+step/2;
    var target=5*360-c;
    rotation+=5*360+(((target-(rotation%360))%360)+360)%360;
    svg.style.transform="rotate("+rotation+"deg)";
    setTimeout(function(){wheelResult(wedges[idx]);spinning=false;},4500);
  });

  var GOAL=5,MAXWRONG=3;
  var deck=[],idx=0,correct=0,wrong=0,answered=false,ended=false;
  var elS=document.getElementById("statement"),elV=document.getElementById("verdict"),
      elC=document.getElementById("correct-count"),elW=document.getElementById("wrong-count"),
      elR=document.getElementById("role-pill"),choices=document.getElementById("choices"),
      dayLabel=document.querySelector("#view-deck .day-label"),
      nextWrap=document.getElementById("next-wrap"),nextBtn=document.getElementById("next");

  function shuffle(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}}
  function counts(){elC.textContent="Correct "+correct+" / "+GOAL;elW.textContent="Wrong "+wrong+" / "+MAXWRONG;}
  function newGame(){deck=cards.slice();shuffle(deck);idx=0;correct=0;wrong=0;ended=false;counts();renderCard();}

  function renderCard(){
    answered=false;var c=deck[idx];
    dayLabel.style.display="block";
    elS.textContent=c.s;
    var rs=roleStyle[c.role];
    elR.textContent=c.role;elR.style.background=rs.bg;elR.style.color=rs.fg;elR.style.display="inline-block";
    elV.innerHTML="";choices.style.display="flex";nextWrap.style.display="none";
  }

  function endScreen(win){
    ended=true;elR.style.display="none";elS.textContent="";dayLabel.style.display="none";
    elV.innerHTML=win
      ? "<div class='verdict-box' style='background:#E1F5EE'><div class='verdict-label' style='color:#0C6B54'>You win a prize!</div><div class='verdict-why' style='color:#0C6B54'>Show this screen to a team member to grab your swag.</div></div>"
      : "<div class='verdict-box' style='background:#FBEAE2'><div class='verdict-label' style='color:#B23A16'>So close!</div><div class='verdict-why' style='color:#B23A16'>You got "+correct+" of "+GOAL+" right. Give it another go.</div></div>";
    choices.style.display="none";nextBtn.textContent="Play again";nextWrap.style.display="block";
  }

  function answer(gm){
    if(answered||ended)return;answered=true;var c=deck[idx];
    var ok=(gm===c.myth);if(ok)correct++;else wrong++;counts();
    var label=c.myth?"Myth":"Reality";
    var col=c.myth?"#B23A16":"#0C6B54";
    var bg=c.myth?"#FBEAE2":"#E1F5EE";
    elV.innerHTML="<div class='verdict-box' style='background:"+bg+"'>"+
      "<div class='verdict-label' style='color:"+col+"'>"+label+"</div>"+
      "<div class='verdict-why' style='color:"+col+"'>"+c.why+"</div></div>"+
      "<div class='mark'>"+(ok?"You got it":"Good try")+"</div>";
    choices.style.display="none";
    if(correct>=GOAL){nextWrap.style.display="none";setTimeout(function(){endScreen(true);},1000);return;}
    if(wrong>=MAXWRONG){nextWrap.style.display="none";setTimeout(function(){endScreen(false);},1000);return;}
    nextBtn.textContent="Next card";nextWrap.style.display="block";
  }

  document.getElementById("c-real").addEventListener("click",function(){answer(false);});
  document.getElementById("c-myth").addEventListener("click",function(){answer(true);});
  nextBtn.addEventListener("click",function(){
    if(ended){newGame();return;}
    idx++;if(idx>=deck.length)idx=0;renderCard();
  });
  newGame();
})();
</script>
</body>
</html>
